app-id: net.sourceforge.Teo
runtime: org.gnome.Platform
runtime-version: '45'
sdk: org.gnome.Sdk
command: teo
finish-args:
  # X11 + XShm access
  - --share=ipc
  - --socket=x11
  # Play sounds
  - --socket=pulseaudio
  # Joystick access
  - --device=all
build-options:
  env:
    DEBUGMODE: '1'
modules:
  - name: teo
    buildsystem: simple
    build-commands:
      - ./autogen.sh
      - DEBIANBUILD=1 DEBUGMODE=1 make
      - install -m0755 -D teo /app/bin/teo
      - mkdir -p /app/share/icons/hicolor/256x256/apps/
      - cp misc/pack/repo/linux/debian/teo/usr/share/pixmaps/${FLATPAK_ID}.png
        /app/share/icons/hicolor/256x256/apps/
      - install -m0644 -D misc/pack/repo/linux/debian/teo/usr/share/applications/${FLATPAK_ID}.desktop
        /app/share/applications/${FLATPAK_ID}.desktop
      - sed -i 's,/usr/games/,/app/bin/,' /app/share/applications/${FLATPAK_ID}.desktop
      - install -m0644 -D misc/pack/repo/linux/debian/teo/usr/share/metainfo/${FLATPAK_ID}.appdata.xml
        /app/share/metainfo/${FLATPAK_ID}.appdata.xml
      - install -d /app/share/teo/
      - cp -r system/ /app/share/teo/
    sources:
      # No Mercurial support to access repo: https://github.com/flatpak/flatpak-builder/issues/235
      - type: archive
        url: http://downloads.sourceforge.net/teoemulator/teo-1.8.4-src.tar.gz
        sha256: 93b636861a67cc72223713c2708391eaf969a7a10ccf2f0288fb41ae6e22c437
        git-init: true
      - type: file
        path: teo-autogen.sh
        dest-filename: autogen.sh
      - type: patch
        path: teo-7722f5749d52537b24808cd621a519f3d05b1e1a....patch
        use-git-am: true
      - type: patch
        path: 0001-linux-Use-a-native-GtkFileChooser.patch
        use-git-am: true
      - type: patch
        path: 0001-linux-Fix-location-of-data-files.patch
        use-git-am: true
      - type: patch
        path: metadata.patch
        use-git-am: true
